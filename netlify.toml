[build]
  # Directory that contains the static assets for the frontend
  publish = "frontend"
  # Optional: command to run before building. Leave empty since the frontend is vanilla HTML/JS
  command = ""

# Proxy API requests to the deployed backend URL (update 'to' with your actual backend URL)
[[redirects]]
  from = "/api/*"
  to = "https://your-backend-url.com/api/:splat"
  status = 200
  force = true

# Fallback for Single Page Application routing (if applicable)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
